<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v3" />
    <title>Side Chat</title>
    <script>window.__APPEARANCE_CACHE_KEY = "com.vastsa.side-chat.appearance.v1";</script>
    <script src="./appearance-boot.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: var(--ds-bg-dock, var(--ds-bg-primary, #f5faff));
        --card: var(--ds-bg-elevated-opaque, var(--ds-bg-secondary, #ffffff));
        --ink: var(--ds-text-primary, #183b5b);
        --muted: var(--ds-text-secondary, #617d96);
        --line: var(--ds-border-default, #dbe8f2);
        --accent: var(--ds-accent, #2776b5);
        --accent-ink: var(--ds-bg-primary, #ffffff);
        --user: var(--ds-bg-active, #e2f0fc);
        --user-ink: var(--ds-text-primary, #183b5b);
        --danger: var(--ds-error, #b42318);
        --ok: var(--ds-success, #23755a);
        --shadow: none;
        --titlebar: var(--pi-plugin-titlebar-height, 0px);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: var(--ds-bg-dock, var(--ds-bg-primary, #152332));
        --card: var(--ds-bg-elevated-opaque, var(--ds-bg-secondary, #1b2c3d));
        --ink: var(--ds-text-primary, #e2edf7);
        --muted: var(--ds-text-secondary, #9bb2c7);
        --line: var(--ds-border-default, #32485c);
        --accent: var(--ds-accent, #80bcf0);
        --accent-ink: var(--ds-bg-primary, #102335);
        --user: var(--ds-bg-active, #244663);
        --user-ink: var(--ds-text-primary, #e2edf7);
        --danger: var(--ds-error, #ff9a91);
        --ok: var(--ds-success, #87cbb2);
        --shadow: none;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        padding-top: var(--titlebar);
        font: 13px/1.45 "PingFang SC", "Segoe UI", -apple-system, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      button, select, textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible, select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .top {
        position: sticky;
        top: var(--titlebar);
        z-index: 3;
        display: grid;
        gap: 8px;
        padding: 10px 12px 8px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand h1 {
        margin: 0;
        flex: 1;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .icon-btn, .ghost {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 8px;
        min-height: 32px;
      }
      .icon-btn {
        width: 32px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .ghost {
        padding: 0 8px;
        color: var(--muted);
      }
      .history-field { display: grid; gap: 5px; min-width: 0; }
      .history-field > span, .project-label { color: var(--muted); font-size: 11px; }
      .project-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      select {
        width: 100%;
        min-width: 0;
        height: 32px;
        min-height: 32px;
        text-overflow: ellipsis;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        padding: 0 8px;
      }
      .toggles {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        align-items: center;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 8px;
        min-height: 32px;
        padding: 4px 9px;
        color: var(--muted);
      }
      .chip.on {
        border-color: color-mix(in oklab, var(--accent) 55%, var(--line));
        color: var(--ink);
        background: color-mix(in oklab, var(--accent) 14%, var(--card));
      }
      .chip:disabled, .icon-btn:disabled, .send:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .log {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow: auto;
        padding: 12px;
        background: var(--card);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .empty {
        margin: auto;
        max-width: 240px;
        text-align: center;
        color: var(--muted);
      }
      .empty strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 15px;
      }
      .msg {
        min-width: 0;
        max-width: 100%;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        box-shadow: var(--shadow);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg:has(.markdown) { white-space: normal; width: 100%; }
      .markdown { line-height: 1.65; overflow-wrap: anywhere; min-width: 0; overflow-x: auto; }
      .markdown > :first-child { margin-top: 0; }
      .markdown > :last-child { margin-bottom: 0; }
      .markdown p, .markdown ul, .markdown ol, .markdown blockquote, .markdown pre { margin: 0.6em 0; }
      .markdown h1, .markdown h2, .markdown h3, .markdown h4, .markdown h5, .markdown h6 { line-height: 1.35; margin: 0.9em 0 0.4em; font-weight: 650; }
      .markdown h1 { font-size: 1.35em; } .markdown h2 { font-size: 1.2em; } .markdown h3 { font-size: 1.1em; }
      .markdown ul, .markdown ol { padding-left: 1.6em; }
      .markdown li + li { margin-top: 0.25em; }
      .markdown code { font-family: Consolas, "SFMono-Regular", monospace; font-size: 0.92em; background: color-mix(in srgb, var(--accent) 8%, var(--card)); padding: 0.1em 0.3em; border-radius: 4px; }
      .markdown pre { max-width: 100%; overflow-x: auto; padding: 10px; background: color-mix(in srgb, var(--accent) 7%, var(--bg)); border: 1px solid var(--line); border-radius: 6px; white-space: pre; overflow-wrap: normal; }
      .markdown pre code { background: none; padding: 0; border-radius: 0; }
      .markdown a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
      .markdown blockquote { margin-left: 0; padding-left: 10px; color: var(--muted); border-left: 3px solid var(--line); }
      .markdown table { border-collapse: collapse; font-size: 0.95em; }
      .markdown th, .markdown td { border: 1px solid var(--line); padding: 5px 8px; }
      .markdown hr { border: 0; border-top: 1px solid var(--line); }
      .markdown .math-display { display: block; max-width: 100%; overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 0.6em 0; }
      .box:has(#attachBtn) { position: relative; }
      .box:has(#attachBtn) textarea { padding-right: 30px; }
      #attachBtn { position: absolute; top: 6px; right: 6px; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px; color: var(--muted); background: transparent; }
      #attachBtn svg { width: 16px; height: 16px; }
      .attachment-list:not([hidden]) { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
      .attachment-chip { display: flex; align-items: center; gap: 4px; max-width: 100%; min-width: 0; padding: 1px 5px; border: 1px solid var(--line); border-radius: 6px; font-size: 11px; }
      .attachment-chip > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .attachment-chip > button { flex: none; border: 0; padding: 0 3px; color: var(--muted); background: transparent; }
      .message-attachments { display: grid; gap: 4px; margin-top: 5px; font-size: 11px; white-space: normal; }
      .msg.user {
        align-self: flex-end;
        max-width: 92%;
        background: var(--user);
        color: var(--user-ink);
        border-color: transparent;
      }
      .msg.error {
        border-color: color-mix(in oklab, var(--danger) 50%, var(--line));
        color: var(--danger);
      }
      .msg.pending {
        color: var(--muted);
        font-style: italic;
      }
      .msg-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .msg-actions button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 0;
        min-height: 0;
      }
      .msg.user .msg-actions button { color: color-mix(in oklab, var(--user-ink) 70%, transparent); }
      .composer {
        padding: 8px 12px 12px;
        border-top: 1px solid var(--line);
        background: var(--bg);
        container-type: inline-size;
      }
      .box {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        padding: 8px;
      }
      .composer-footer { --model-min-width: 0px; --footer-control-height: 24px; position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; margin-top: 8px; }
      .composer-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
      .composer-actions .send { flex: none; }
      .context-toggle { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 4px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; }
      .composer-footer svg { width: 18px; height: 18px; flex: none; }
      .composer-footer .model-chevron { width: 12px; height: 12px; color: var(--muted); }
      .switch-track { position: relative; width: 32px; height: 18px; border-radius: 999px; background: var(--line); }
      .switch-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0002; }
      .context-toggle[aria-checked="true"] .switch-track { background: var(--accent); }
      .context-toggle[aria-checked="true"] .switch-track::after { transform: translateX(14px); }
      .model-control { position: static; display: flex; justify-content: flex-end; min-width: 0; }
      .model-trigger { display: flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; height: var(--footer-control-height); min-height: var(--footer-control-height); padding: 0 6px; border: 0; border-radius: 6px; color: var(--ink); background: transparent; }
      .composer-footer .context-toggle, .composer-footer .return-draft, .composer-footer .send { height: var(--footer-control-height); min-height: var(--footer-control-height); padding-block: 0; }
      .model-name { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .thinking-value { flex: none; padding: 1px 6px; border-radius: 5px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
      .model-menu { position: absolute; bottom: calc(100% + 6px); right: 0; width: min(440px, 100%); z-index: 6; display: grid; grid-template-rows: minmax(0, 1fr) auto; max-height: calc(100dvh - var(--titlebar) - 160px); background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px #0002; overflow: hidden; }
      .model-menu[hidden] { display: none; }
      .model-body { display: grid; grid-template-columns: 100px minmax(0, 1fr); height: min(230px, 32dvh); min-height: 0; }
      .model-providers, .model-options { min-width: 0; overflow: auto; padding: 6px; }
      .model-providers { border-right: 1px solid var(--line); }
      .model-filter, .model-option { display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0; padding: 6px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); text-align: left; }
      .model-filter > :first-child, .model-option .model-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .model-count, .model-provider { font-size: 11px; color: var(--muted); }
      .model-provider { max-width: 40%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .model-filter:hover, .model-option:hover, .thinking-option:hover { background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
      .model-filter[aria-pressed="true"], .model-option[aria-selected="true"], .thinking-option[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
      .model-thinking { display: flex; align-items: center; gap: 6px; padding: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
      .thinking-options { display: flex; flex: 1; flex-wrap: wrap; gap: 2px; }
      .thinking-option { flex: 1; padding: 4px; border: 0; border-radius: 5px; color: var(--ink); background: transparent; }
      .composer-footer[data-model-compact="true"] .model-chevron { display: none; }
      .composer-footer[data-thinking-hidden="true"] .thinking-value { display: none; }
      textarea {
        width: 100%;
        min-height: 44px;
        max-height: 140px;
        border: 0;
        outline: none;
        resize: none;
        background: transparent;
        padding: 4px;
      }
      textarea::placeholder { color: var(--ds-placeholder-ink, var(--ds-text-secondary, revert)); }
      .send {
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: var(--accent-ink);
        min-height: 32px;
        padding: 0 12px;
        font-weight: 600;
      }
      .hint {
        margin: 6px 2px 0;
        color: var(--muted);
        font-size: 11px;
      }
      .drawer {
        position: fixed;
        inset: var(--titlebar) 0 0 0;
        background: color-mix(in oklab, #000 38%, transparent);
        z-index: 5;
        display: none;
      }
      .drawer.open { display: block; }
      .drawer-card {
        width: min(320px, 86vw);
        height: 100%;
        background: var(--bg);
        border-right: 1px solid var(--line);
        padding: 12px;
        overflow: auto;
      }
      .history-field { margin-bottom: 10px; }
      .history-note { font-size: 12px; color: var(--muted); margin: 8px 0; }
      #returnBtn { margin-bottom: 8px; }
      .conv {
        width: 100%; min-width: 0; text-align: left;
        border: 1px solid var(--line); background: var(--card); border-radius: 8px;
        padding: 10px; margin-bottom: 8px; cursor: pointer;
        display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px;
      }
      .conv > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .conv > small { grid-column: 1; color: var(--muted); }
      .conv > button { grid-column: 2; grid-row: 1 / 3; align-self: center; }
      .conv.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1 data-i18n="title"></h1>
        <button class="icon-btn" id="newBtn" type="button" data-i18n-title="newChat">+</button>
        <button class="icon-btn" id="listBtn" type="button" data-i18n-title="chats">≡</button>
      </div>
    </header>
    <div class="project-label" id="projectLabel" style="padding:4px 12px;background:var(--bg)"></div>
    <div class="history-note" id="historyNote" style="padding:0 12px" hidden></div>
    <button class="ghost" id="returnBtn" type="button" data-i18n="returnCurrent" hidden></button>
    <div class="log" id="log"></div>
    <form class="composer" id="form">
      <div class="box">
        <textarea id="input" rows="2"></textarea>
        <input id="attachmentInput" type="file" multiple hidden />
        <button id="attachBtn" type="button" data-i18n-title="addAttachments" data-i18n-label="addAttachments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 12 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9"/></svg></button>
        <div id="attachmentList" class="attachment-list" aria-live="polite" hidden></div>
      </div>
      <div class="composer-footer" data-model-compact="false">
        <button class="context-toggle" id="ctxBtn" type="button" role="switch" aria-checked="false" data-i18n-title="includeSession" data-i18n-label="includeSession">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18v3l4-3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v8a3 3 0 0 0 1 3Z"/><path d="M8 9h8M8 13h5"/></svg>
          <span class="switch-track" aria-hidden="true"></span>
        </button>
        <div class="model-control" id="modelControl">
          <button class="model-trigger" id="modelMenuButton" type="button" aria-haspopup="dialog" aria-controls="modelMenu" aria-expanded="false">
            <span class="model-name" id="modelValue"></span><span class="thinking-value" id="thinkingValue"></span><svg class="model-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="model-menu" id="modelMenu" role="dialog" data-i18n-title="model" hidden>
            <div class="model-body"><div class="model-providers" id="modelProviders"></div><div class="model-options" id="modelOptions" role="listbox" data-i18n-title="model"></div></div>
            <div class="model-thinking"><span data-i18n="thinking"></span><div class="thinking-options" id="thinkingOptions"></div></div>
          </div>
          <select id="modelSelect" hidden></select>
          <select id="thinkSelect" hidden>
            <option value="off">off</option><option value="minimal">min</option><option value="low">low</option><option value="medium">med</option><option value="high">high</option><option value="xhigh">xhigh</option><option value="max">max</option>
          </select>
        </div>
        <div class="composer-actions">
          <button class="icon-btn return-draft" id="insertBtn" type="button" data-i18n-title="insert" data-i18n-label="insert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-5 5 5 5M4 9h10a6 6 0 0 1 0 12h-2"/></svg>
          </button>
          <button class="send" id="sendBtn" type="submit" data-i18n="send"></button>
        </div>
      </div>
      <div class="hint" id="hint"></div>
    </form>
    <div class="drawer" id="drawer">
      <div class="drawer-card">
        <div class="brand" style="margin-bottom:10px">
          <h1 data-i18n="chats"></h1>
          <button class="ghost" id="closeList" type="button" data-i18n="closeList"></button>
        </div>
        <label class="history-field"><span data-i18n="historyProject"></span><select id="historySelect"></select></label>
        <div id="convList"></div>
      </div>
    </div>
    <script src="./vendor/marked.umd.js"></script>
    <script src="./vendor/purify.min.js"></script>
    <script src="./vendor/marked-cjk-friendly.js"></script>
    <script src="./vendor/katex.min.js"></script>
    <script src="./markdown.js"></script>
    <script src="./appearance.js"></script>

          insertOk: "已放回主输入框，未发送",
          insertBusy: "另一条回填请求尚未完成",
          draftUnavailable: "主输入框不可用，请重新加载开发插件并确认 renderer.extension 授权。",
          draftStale: "主输入框已变化，请重新回填。",
          draftTooLarge: "回复超过宿主单次回填的 32 KiB 限制。",
          insertNeed: "请先打开一个会话",
          closeList: "关闭",
          deleteChat: "删除",
          unnamed: "未命名",
          thisProject: "当前项目",
          allModels: "全部模型",
          historyProject: "项目历史",
          legacy: "旧版历史（未归类）",
          general: "独立会话",
          returnStandalone: "返回独立会话",
          browsingGeneral: "正在浏览其他会话历史（只读），发送前请返回当前会话。",
          returnCurrent: "返回当前项目",
          browsing: "正在浏览其他项目历史（只读），发送前请返回当前项目。",
          sessionChanged: "当前会话已变化，请重新发送。",
        }
      };

      const state = {
        locale: "en",
        snapshot: { activeId: null, conversations: [] },
        settings: { modelKey: "", thinkingLevel: "low", includeSession: true },
        models: [],
        context: null,
        projects: [],
        contextError: false,
        pending: false,
        inserting: false,
        pendingProjectKey: "",
        jobId: ""
      };
      const attachmentInput = window.SideChatAttachments.create({
        invoke, scope: () => ({ ...scope(), conversationId: activeConv().id }),
        ready: () => !state.pending && Boolean(state.context) && !state.contextError && isCurrentHistory(),
        t, hint,
      });

      function t(key) {
        const table = COPY[state.locale] || COPY.en;
        return table[key] || COPY.en[key] || key;
      }

      function localeOf(raw) {
        const value = String(raw || "").toLowerCase();
        return value.startsWith("zh") ? "zh-CN" : "en";
      }

      function $(id) {
        return document.getElementById(id);
      }

      function applyCopy() {
        document.documentElement.lang = state.locale;
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          node.textContent = t(node.getAttribute("data-i18n"));
        });
        document.querySelectorAll("[data-i18n-title]").forEach((node) => {
          node.title = t(node.getAttribute("data-i18n-title"));
        });
        document.querySelectorAll("[data-i18n-label]").forEach((node) => {
          node.setAttribute("aria-label", t(node.getAttribute("data-i18n-label")));
        });
        $("input").placeholder = t("placeholder");
      }

      async function invoke(channel, payload) {
        if (!window.pluginBridge?.invoke) throw new Error("pluginBridge missing");
        return window.pluginBridge.invoke(channel, payload || {});
      }

      function activeConv() {
        return state.snapshot.conversations.find((item) => item.id === state.snapshot.activeId)
          || state.snapshot.conversations[0]
          || { messages: [] };
      }

      let contextRequest = 0;
      let viewRequest = 0;

      function isCurrentHistory() {
        return Boolean(state.context && state.snapshot.projectKey === state.context.projectKey);
      }

      function scope() {
        return { sessionId: state.context?.sessionId || "", projectKey: state.context?.projectKey || "" };
      }

      function projectName(key, name) {
        return key === "legacy" ? t("legacy") : key === "general" ? t("general") : name || key;
      }

      function historyLabel(project) {
        const label = projectName(project.key, project.name);
        const sameName = state.projects.some(other => other.key !== project.key && projectName(other.key, other.name) === label);
        // A name is not a project identity. Keep separate nonempty histories selectable.
        return label + (sameName ? ` [${project.key}]` : "");
      }

      async function refreshContext() {
        const request = ++contextRequest;
        try {
          const data = await invoke("chat.context");
          if (request !== contextRequest) return;
          const changed = state.context?.sessionId !== data.context.sessionId || state.context?.projectKey !== data.context.projectKey;
          const recovered = state.contextError;
          state.contextError = false;
          state.projects = data.projects || [];
          state.context = data.context;
          if (changed) {
            ++viewRequest;
            state.snapshot = data.snapshot;
            hint("");
            renderAll();
          } else if (recovered) renderSelects();
        } catch (error) {
          if (request !== contextRequest) return;
          state.contextError = true;
          hint(error?.message || t("error"));
          renderSelects();
        }
      }

      async function showHistory(channel, payload) {
        const request = ++viewRequest;
        try {
          const result = await invoke(channel, payload);
          if (request !== viewRequest) return;
          state.snapshot = result.snapshot;
          state.projects = result.projects || state.projects;
          renderAll();
        } catch (error) { hint(error?.message || t("error")); }
      }

      function fillSelect(node, groups) {
        const current = node.value;
        node.replaceChildren();
        for (const group of groups) {
          const parent = group.label ? document.createElement("optgroup") : node;
          if (group.label) {
            parent.label = group.label;
            node.appendChild(parent);
          }
          for (const option of group.options) {
            const el = document.createElement("option");
            el.value = option.value;
            el.textContent = option.label;
            parent.appendChild(el);
          }
        }
        if ([...node.options].some((item) => item.value === current)) node.value = current;
      }

      function modelDisplayName(model) {
        return (model.alias || model.label || model.key).replace(/\s*[（(].*[)）]\s*$/, "").trim();
      }

      function renderSelects() {
        const context = state.context;
        const standalone = context?.projectKey === "general";
        $("projectLabel").textContent = standalone ? t("general") : `${t("thisProject")}: ${context ? projectName(context.projectKey, context.projectName) : "—"}`;
        $("projectLabel").title = context?.projectPath || "";
        const browsing = Boolean(context) && !isCurrentHistory();
        $("historyNote").hidden = !browsing;
        $("historyNote").textContent = t(standalone || state.snapshot.projectKey === "general" ? "browsingGeneral" : "browsing");
        $("returnBtn").hidden = !browsing;
        $("returnBtn").textContent = t(standalone ? "returnStandalone" : "returnCurrent");

        const modelOptions = state.models.length
          ? [{ label: "", options: state.models.map((model) => ({ value: model.key, label: modelDisplayName(model) })) }]
          : [{ label: "", options: [{ value: "", label: t("noModel") }] }];
        fillSelect($("modelSelect"), modelOptions);
        if (state.settings.modelKey) $("modelSelect").value = state.settings.modelKey;
        $("thinkSelect").value = state.settings.thinkingLevel || "low";
        $("ctxBtn").classList.toggle("on", state.settings.includeSession === true);
        $("ctxBtn").setAttribute("aria-checked", String(state.settings.includeSession === true));
        $("sendBtn").disabled = state.pending || !state.models.length || !isCurrentHistory() || state.contextError;
        $("insertBtn").disabled = state.inserting || !isCurrentHistory() || !context?.sessionId || state.contextError;
        $("insertBtn").setAttribute("aria-busy", String(state.inserting));
        $("newBtn").disabled = !context || state.contextError;
        $("input").disabled = browsing || !context || state.contextError;
        renderModelPicker();
      }

      const modelTextMeasure = document.createElement("canvas").getContext("2d");

      function measureFooterText(node) {
        const style = getComputedStyle(node), characters = Array.from(node.textContent);
        modelTextMeasure.font = style.font;
        return modelTextMeasure.measureText(characters.join("")).width
          + Math.max(0, characters.length - 1) * (parseFloat(style.letterSpacing) || 0)
          + parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      }

      function updateFooterLayout() {
        const footer = document.querySelector(".composer-footer");
        const style = getComputedStyle(footer);
        const triggerStyle = getComputedStyle($("modelMenuButton"));
        const triggerGap = parseFloat(triggerStyle.columnGap) || 0;
        const padding = parseFloat(triggerStyle.paddingLeft) + parseFloat(triggerStyle.paddingRight);
        // Measure intrinsic widths even while hidden, so resize thresholds stay stable.
        const nameWidth = measureFooterText($("modelValue")), thinkingWidth = measureFooterText($("thinkingValue"));
        const minimum = Math.ceil(nameWidth + thinkingWidth
          + parseFloat(getComputedStyle(document.querySelector(".model-chevron")).width) + triggerGap * 2 + padding);
        const withoutArrow = Math.ceil(nameWidth + thinkingWidth + triggerGap + padding);
        footer.style.setProperty("--model-min-width", `${minimum}px`);
        const gap = parseFloat(style.columnGap) || 0;
        const available = footer.clientWidth - $("ctxBtn").offsetWidth - footer.querySelector(".composer-actions").offsetWidth - gap * 2;
        footer.dataset.modelCompact = String(available < minimum);
        footer.dataset.thinkingHidden = String(available < withoutArrow);
      }

      let modelProvider = "";

      function modelProviderId(model) {
        return model.providerId || model.key.split("/")[0];
      }

      function setModelMenuOpen(open) {
        $("modelMenu").hidden = !open;
        $("modelMenuButton").setAttribute("aria-expanded", String(open));
        if (open) {
          renderModelPicker();
          ($("modelOptions").querySelector('[aria-selected="true"]') || $("modelOptions").querySelector("button"))?.focus();
        }
      }

      function renderModelPicker() {
        const selected = state.models.find((model) => model.key === $("modelSelect").value);
        const name = selected ? modelDisplayName(selected) : t("noModel");
        $("modelValue").textContent = name;
        $("thinkingValue").textContent = $("thinkSelect").value;
        $("modelMenuButton").title = `${name} · ${t("thinking")}: ${$("thinkSelect").value}`;
        $("modelMenuButton").disabled = !state.models.length;
        $("modelMenu").setAttribute("aria-label", `${t("model")} / ${t("thinking")}`);
        $("modelOptions").setAttribute("aria-label", t("model"));
        const providers = new Map();
        for (const model of state.models) {
          const id = modelProviderId(model);
          if (!providers.has(id)) providers.set(id, { name: model.providerName || id, count: 0 });
          providers.get(id).count += 1;
        }
        if (modelProvider && !providers.has(modelProvider)) modelProvider = "";
        $("modelProviders").replaceChildren();
        for (const [id, provider] of [["", { name: t("allModels"), count: state.models.length }], ...providers]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "model-filter";
          button.dataset.provider = id;
          button.setAttribute("aria-pressed", String(id === modelProvider));
          button.title = provider.name;
          const label = document.createElement("span"); label.textContent = provider.name;
          const count = document.createElement("span"); count.className = "model-count"; count.textContent = provider.count;
          button.append(label, count);
          button.addEventListener("click", () => { modelProvider = id; renderModelPicker(); });
          $("modelProviders").appendChild(button);
        }
        $("modelOptions").replaceChildren();
        for (const model of state.models.filter((item) => !modelProvider || modelProviderId(item) === modelProvider)) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "model-option";
          button.dataset.modelKey = model.key;
          button.setAttribute("role", "option");
          button.setAttribute("aria-selected", String(model.key === $("modelSelect").value));
          const label = document.createElement("span"); label.className = "model-name"; label.textContent = modelDisplayName(model);
          const provider = document.createElement("span"); provider.className = "model-provider"; provider.textContent = model.providerName || modelProviderId(model);
          const mark = document.createElement("span"); mark.textContent = model.key === $("modelSelect").value ? "✓" : ""; mark.setAttribute("aria-hidden", "true");
          button.title = `${label.textContent} · ${provider.textContent}`;
          button.append(label, provider, mark);
          button.addEventListener("click", () => {
            $("modelSelect").value = model.key;
            $("modelSelect").dispatchEvent(new Event("change"));
            renderModelPicker();
            setModelMenuOpen(false);
            $("modelMenuButton").focus();
          });
          $("modelOptions").appendChild(button);
        }
        $("thinkingOptions").replaceChildren();
        for (const option of $("thinkSelect").options) {
          const button = document.createElement("button");
          button.type = "button"; button.className = "thinking-option"; button.dataset.level = option.value;
          button.textContent = option.textContent; button.setAttribute("aria-pressed", String(option.value === $("thinkSelect").value));
          button.addEventListener("click", () => {
            $("thinkSelect").value = option.value;
            $("thinkSelect").dispatchEvent(new Event("change"));
            renderModelPicker();
            $("thinkingOptions").querySelector(`[data-level="${option.value}"]`)?.focus();
          });
          $("thinkingOptions").appendChild(button);
        }
        updateFooterLayout();
      }

      function pendingHere() {
        return state.pending && state.pendingProjectKey === state.snapshot.projectKey;
      }

      function renderMessages() {
        const log = $("log");
        const conv = activeConv();
        const messages = conv.messages || [];
        log.replaceChildren();
        if (!messages.length && !pendingHere()) {
          const empty = document.createElement("div");
          empty.className = "empty";
          const title = document.createElement("strong");
          title.textContent = t("emptyTitle");
          const hint = document.createElement("div");
          hint.textContent = t("emptyHint");
          empty.append(title, hint);
          log.appendChild(empty);
          return;
        }
        for (const message of messages) {
          log.appendChild(renderMsg(message));
        }
        if (pendingHere()) {
          const pending = document.createElement("div");
          pending.className = "msg pending";
          pending.textContent = t("sending");
          log.appendChild(pending);
        }
        log.scrollTop = log.scrollHeight;
      }

      function renderMsg(message) {
        const node = document.createElement("div");
        node.className = "msg" + (message.role === "user" ? " user" : "") + (message.error ? " error" : "");
        if (message.role === "assistant" && !message.error) {
          const content = document.createElement("div");
          content.className = "markdown";
          content.appendChild(window.SideChatMarkdown.render(message.content));
          node.appendChild(content);
        } else node.textContent = message.error ? formatError(message.content) : message.content;
        if (message.attachments?.length) node.appendChild(window.SideChatAttachments.renderMessage(message.attachments));
        if (message.role === "assistant" && !message.error) {
          const actions = document.createElement("div");
          actions.className = "msg-actions";
          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.textContent = t("copy");
          copyBtn.addEventListener("click", () => copyText(message.content, copyBtn));
          actions.appendChild(copyBtn);
          node.appendChild(actions);
        }
        return node;
      }

      function formatError(content) {
        if (content === "RATE_LIMITED") return t("rateLimited");
        if (String(content).includes("ATTACHMENTS_GUARD_UNCONFIRMED") || String(content).includes("Side Chat read-only extension did not confirm startup")) return t("attachmentsUnconfirmed");
        if (String(content).includes("agent.extension")) return t("attachmentsReload");
        if (String(content).includes("10 MB") || String(content).includes("20 MB")) return t("attachmentLimit");
        if (String(content).includes("Session changed") || content === "STALE_CONTEXT") return t("sessionChanged");
        if (String(content).includes("Draft bridge") || String(content).includes("no composer")) return t("draftUnavailable");
        if (String(content).includes("main draft changed")) return t("draftStale");
        if (String(content).includes("32 KiB")) return t("draftTooLarge");
        return content || t("error");
      }

      function renderConvs() {
        const list = $("convList");
        list.replaceChildren();
        fillSelect($("historySelect"), [{ label: "", options: state.projects.map((project) => ({
          value: project.key,
          label: historyLabel(project) + (project.key !== "general" && project.key === state.context?.projectKey ? ` (${t("thisProject")})` : "")
        })) }]);
        $("historySelect").value = state.snapshot.projectKey || "";
        const projectKey = state.snapshot.projectKey;
        for (const conv of state.snapshot.conversations) {
          const row = document.createElement("div");
          row.className = "conv" + (conv.id === state.snapshot.activeId ? " active" : "");
          const title = document.createElement("div");
          title.textContent = conv.title || t("unnamed");
          const meta = document.createElement("small");
          meta.textContent = (conv.messages || []).length ? String((conv.messages || []).length) : "";
          row.append(title, meta);
          row.addEventListener("click", async () => {
            await showHistory("chat.select", { id: conv.id, projectKey });
            $("drawer").classList.remove("open");
          });
          const del = document.createElement("button");
          del.type = "button";
          del.className = "ghost";
          del.textContent = t("deleteChat");
          del.disabled = !isCurrentHistory();
          del.addEventListener("click", async (event) => {
            event.stopPropagation();
            await showHistory("chat.delete", { id: conv.id, projectKey });
          });
          row.appendChild(del);
          list.appendChild(row);
        }
      }

      function renderAll() {
        applyCopy();
        renderSelects();
        attachmentInput.sync();
        renderMessages();
        renderConvs();
      }

      async function copyText(text, button) {
        try {
          await invoke("chat.copy", { text });
          button.textContent = t("copied");
          setTimeout(() => { button.textContent = t("copy"); }, 1200);
        } catch {
          button.textContent = t("error");
        }
      }

      function hint(text, ok) {
        $("hint").textContent = text || "";
        $("hint").className = "hint" + (ok ? " status" : "");
      }

      async function saveSettings(patch) {
        const result = await invoke("chat.setSettings", patch);
        state.settings = result.settings;
      }

      async function waitJob(jobId, backend) {
        for (let i = 0; i < (backend === "agent" ? 480 : 240); i += 1) {
          const result = await invoke("chat.poll", { jobId });
          if (result.status === "running" || result.status === "missing" && i < 3) {
            await new Promise((resolve) => setTimeout(resolve, 400));
            continue;
          }
          return result;
        }
        return { status: "error", error: t("error") };
      }

      $("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = $("input").value.trim();
        if ((!text && !attachmentInput.hasFiles()) || state.pending || !isCurrentHistory() || state.contextError) return;
        const target = { ...scope(), conversationId: activeConv().id };
        const modelKey = $("modelSelect").value;
        const thinkingLevel = $("thinkSelect").value;
        state.pending = true;
        state.pendingProjectKey = target.projectKey;
        renderAll();
        try {
          await refreshContext();
          if (state.contextError || target.sessionId !== scope().sessionId || target.projectKey !== scope().projectKey) {
            hint(t("sessionChanged"));
            return;
          }
          const uploaded = await attachmentInput.upload(target);
          const result = await invoke("chat.send", {
            text, ...target, modelKey, thinkingLevel,
            includeSession: state.settings.includeSession,
            ...(uploaded.length ? { attachments: uploaded } : {}),
          });
          if (scope().projectKey === target.projectKey && activeConv().id === target.conversationId) {
            $("input").value = "";
            attachmentInput.clear(target);
          }
          if (state.snapshot.projectKey === result.snapshot.projectKey) state.snapshot = result.snapshot;
          state.settings = result.settings || state.settings;
          state.jobId = result.jobId;
          renderAll();
          const done = await waitJob(result.jobId, result.backend);
          if (done.snapshot?.projectKey === state.snapshot.projectKey) {
            state.snapshot = done.snapshot;
            if (done.status === "error") hint(formatError(done.error || done.code));
            else hint("");
          }
        } catch (error) {
          hint(formatError(error?.message || error?.code));
          await refreshContext();
        } finally {
          state.pending = false;
          state.jobId = "";
          state.pendingProjectKey = "";
          renderAll();
          $("input").focus();
        }
      });

      $("input").addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          $("form").requestSubmit();
        }
      });

      $("newBtn").addEventListener("click", async () => {
        await refreshContext();
        if (!state.context || state.contextError) return;
        await showHistory("chat.new", scope());
        $("input").focus();
      });
      $("listBtn").addEventListener("click", async () => {
        await refreshContext();
        renderConvs();
        $("drawer").classList.add("open");
      });
      $("historySelect").addEventListener("change", () => showHistory("chat.history", { projectKey: $("historySelect").value }));
      $("returnBtn").addEventListener("click", () => showHistory("chat.history", { projectKey: state.context.projectKey }));
      $("closeList").addEventListener("click", () => $("drawer").classList.remove("open"));
      $("drawer").addEventListener("click", (event) => {
        if (event.target === $("drawer")) $("drawer").classList.remove("open");
      });
      $("ctxBtn").addEventListener("click", async () => {
        await saveSettings({ includeSession: !state.settings.includeSession });
        renderAll();
      });
      $("modelMenuButton").addEventListener("click", () => setModelMenuOpen($("modelMenu").hidden));
      document.addEventListener("pointerdown", (event) => {
        if (!$("modelControl").contains(event.target)) setModelMenuOpen(false);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !$("modelMenu").hidden) {
          event.preventDefault(); setModelMenuOpen(false); $("modelMenuButton").focus();
        }
      });
      $("modelOptions").addEventListener("keydown", (event) => {
        if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
        const options = [...$("modelOptions").querySelectorAll("button")];
        if (!options.length) return;
        event.preventDefault();
        const next = options.indexOf(document.activeElement) + (event.key === "ArrowDown" ? 1 : -1);
        options[(next + options.length) % options.length].focus();
      });
      $("modelSelect").addEventListener("change", () => saveSettings({ modelKey: $("modelSelect").value }));
      $("thinkSelect").addEventListener("change", () => saveSettings({ thinkingLevel: $("thinkSelect").value }));
      $("insertBtn").addEventListener("click", async () => {
        const last = [...(activeConv().messages || [])].reverse().find((item) => item.role === "assistant" && !item.error);
        if (!last || !isCurrentHistory() || state.inserting) return;
        const target = scope();
        if (!target.sessionId) { hint(t("insertNeed")); return; }
        state.inserting = true;
        renderSelects();
        try {
          await invoke("chat.insert", { ...target, text: last.content });
          hint(t("insertOk"), true);
        } catch (error) {
          const message = String(error?.message || "");
          hint(message.toLowerCase().includes("busy") ? t("insertBusy") : formatError(message || error?.code));
        } finally {
          state.inserting = false;
          renderSelects();
        }
      });

      $("log").addEventListener("click", async (event) => {
        const link = event.target.closest("a");
        if (!link) return;
        event.preventDefault();
        const href = link.getAttribute("href") || "";
        if (!/^(https?:\/\/|mailto:)/i.test(href)) return;
        try { await invoke("shell.openExternal", { url: href }); }
        catch (error) { hint(error?.message || t("error")); }
      });

      async function boot() {
        try {
          const data = await invoke("chat.bootstrap");
          state.snapshot = data.snapshot;
          state.settings = data.settings;
          state.models = data.models || [];
          state.context = data.context;
          state.projects = data.projects || [];
          state.locale = localeOf(data.locale);
        } catch (error) {
          hint(error?.message || t("error"));
        }
        renderAll();
      }

      if (window.__appearance) {
        window.__appearance.onLocaleChange((locale) => {
          state.locale = localeOf(locale);
          renderAll();
        });
        window.__appearance.init(window.pluginBridge);
      }
      const unsubscribers = [];
      for (const event of ["session:activated", "workspace:changed"]) {
        const unsubscribe = window.pluginBridge?.on?.(event, () => { void refreshContext(); });
        if (typeof unsubscribe === "function") unsubscribers.push(unsubscribe);
      }
      const recoverContext = () => { if (!document.hidden) void refreshContext(); };
      document.addEventListener("visibilitychange", recoverContext);
      window.addEventListener("focus", recoverContext);
      // Detached panels do not receive session:activated; pulls also repair missed pushes.
      window.addEventListener("resize", updateFooterLayout);
      const contextTimer = setInterval(recoverContext, 2000);
      window.addEventListener("pagehide", () => {
        clearInterval(contextTimer);
        for (const unsubscribe of unsubscribers) unsubscribe();
        document.removeEventListener("visibilitychange", recoverContext);
        window.removeEventListener("focus", recoverContext);
        window.removeEventListener("resize", updateFooterLayout);
      }, { once: true });
      boot().then(refreshContext);
    </script>
  </body>
</html>
